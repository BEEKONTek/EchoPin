include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # ── Style — silenced to match repo conventions ─────────────────────────
    # Explicit type annotations are a readability choice; this repo uses them
    # consistently and prefers them at hand-off boundaries.
    omit_local_variable_types: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    prefer_final_locals: false
    public_member_api_docs: false
    use_key_in_widget_constructors: false

    # ── Intentional patterns ───────────────────────────────────────────────
    # SecureStorageKvStore swallows platform errors on purpose so that a
    # missing backend (Linux/web/CI) degrades to no-op rather than crashing.
    empty_catches: false

    # ── Correctness ────────────────────────────────────────────────────────
    avoid_print: true
    avoid_empty_else: true
    await_only_futures: true
    unawaited_futures: true
    use_build_context_synchronously: true

    # NOTE: unused_import / unused_local_variable / unused_element are
    # analyzer diagnostics, not lints — they fire automatically and cannot be
    # toggled here. They caught two real unused imports today; keep them on.
