name: Test
on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  lan-integration:
    # Real Bonjour discovery + TCP between two engines on one host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            avahi-daemon libnss-mdns xvfb
          sudo systemctl start avahi-daemon
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test -d linux

  server:
    # Accounts, reports, sealed logs, audit chain and backup/restore against
    # a real PostgreSQL (pg_dump/pg_restore come from the runner's client).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echopin
          POSTGRES_PASSWORD: echopin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echopin" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ECHOPIN_TEST_DATABASE_URL: postgresql://echopin:echopin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - run: cd packages/echopin_protocol && dart pub get && dart analyze && dart test
      - run: cd server && dart pub get && dart analyze && dart test
