name: Test
on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      # The expanded reporter names each failing test; the failures are
      # repeated as annotations so they show on the run page without opening
      # the log.
      - run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee app-test.log || {
            grep -B 60 '\[E\]' app-test.log | head -200 | sed 's/^/::error::/' ; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  lan-integration:
    # Real Bonjour discovery + TCP between two engines on one host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            avahi-daemon libnss-mdns xvfb
          sudo systemctl start avahi-daemon
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      # One file per invocation: the live-server test only compiles here (it
      # skips without ECHOPIN_SERVER_URL), and a shared run can trip on the
      # first test's teardown.
      - run: xvfb-run -a flutter test integration_test/lan_transport_test.dart -d linux --reporter github
      - run: xvfb-run -a flutter test integration_test/live_server_test.dart -d linux --reporter github

  server:
    # Accounts, reports, sealed logs, audit chain and backup/restore against
    # a real PostgreSQL (pg_dump/pg_restore come from the runner's client).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echopin
          POSTGRES_PASSWORD: echopin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echopin" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ECHOPIN_TEST_DATABASE_URL: postgresql://echopin:echopin@127.0.0.1:5432/postgres
      # Same major as the service: a newer pg_restore emits settings an
      # older server rejects (e.g. transaction_timeout, PostgreSQL 17+).
      PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - run: cd packages/echopin_protocol && dart pub get && dart analyze && dart test --reporter github
      - run: |
          set -o pipefail
          cd server && dart pub get && dart analyze
          dart test --reporter expanded 2>&1 | tee server-test.log || {
            grep -B 60 '\[E\]' server-test.log | head -200 | sed 's/^/::error::/' ; exit 1; }
