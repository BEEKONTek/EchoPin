name: Lint & Analyze

on:
  push:
    branches: [main, develop, deepseek-mvp]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Dart Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings
