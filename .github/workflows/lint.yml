name: Lint & Analyze

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Dart Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter analyze
        run: flutter analyze --no-fatal-warnings

  format:
    name: Code Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Check code format
        run: dart format --output=none --set-exit-if-changed lib/ test/

  pubspec-check:
    name: Pubspec Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Get dependencies
        run: flutter pub get

      - name: Validate pubspec.yaml
        run: |
          python3 << 'EOF'
          import yaml
          import sys

          with open('pubspec.yaml', 'r') as f:
              data = yaml.safe_load(f)

          if data.get('publish_to') != 'none':
              print("ERROR: pubspec.yaml must keep 'publish_to: none' for this app")
              sys.exit(1)
          print("✓ publish_to: none is set")
          EOF
