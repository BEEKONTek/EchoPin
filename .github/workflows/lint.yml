name: Lint
on: [push]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
