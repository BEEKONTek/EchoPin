name: echo_pin
description: "Privacy-first peer presence for local sessions."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^22.3.3
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  cryptography: ^2.9.0
  connectivity_plus: ^7.3.1
  mobile_scanner: ^7.5.0
  bonsoir: ^7.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
