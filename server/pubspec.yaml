  http: ^1.6.0
  logging: ^1.3.0
  mailer: ^7.2.2
  postgres: ^3.6.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
