# 3G heap + 1G metaspace fits comfortably in 7.2 GB RAM and avoids the
# Linux OOM-killer that causes "Gradle build daemon disappeared".
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
# Added by Flutter template:
android.newDsl=false
android.builtInKotlin=false
